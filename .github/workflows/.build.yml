name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: 
      - uses: actions/setup-java@v4
        with:unzip -oq NovaPubg.zip
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
           NovaPubg
      - run: gradle assembleDebug --no-daemon
        working-directory: nova-app
      - uses: actions/upload-artifact@v4
        with:
          name: nova-apk
          path: nova-app/app/build/outputs/apk/debug/app-debug.apk
